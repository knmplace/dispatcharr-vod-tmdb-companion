# Example compose service to add to your OWN existing Dispatcharr stack.
# Copy the `vod-tmdb-companion` service block below into your Dispatcharr
# docker-compose.yml (or docker stack, e.g. Portainer) and adjust the values
# marked CHANGE ME. Do not deploy this file standalone -- it must join the
# same Docker network as your Dispatcharr container to reach its Postgres.
#
# This container reaches Dispatcharr's Postgres over Docker's internal
# network, not a published port -- Postgres/Redis should never be exposed
# externally for this to work. Find your Dispatcharr network name with:
#   docker inspect <dispatcharr_container> \
#     --format '{{range .NetworkSettings.Networks}}{{.NetworkID}} {{end}}'
#   docker network ls   # match the network ID above to a name
#
# POSTGRES_HOST must resolve, via that network's DNS, to wherever Dispatcharr's
# Postgres actually runs:
#   - All-in-one (AIO) Dispatcharr image (Postgres runs inside the same
#     container as Dispatcharr itself): point POSTGRES_HOST at the
#     Dispatcharr container's own name/alias on the shared network.
#   - Split multi-container deployment with its own postgres service: point
#     POSTGRES_HOST at that service's name instead.
#
# You should NOT need to type Postgres credentials by hand: `env_file`
# below points this service at the SAME .env file your Dispatcharr stack
# already uses, so POSTGRES_HOST/PORT/DB/USER/PASSWORD are picked up
# automatically from values that already exist -- nothing is duplicated or
# re-entered. Point env_file at wherever that file actually lives relative
# to this compose file (same directory as your Dispatcharr docker-compose.yml).
services:
  vod-tmdb-companion:
    image: ghcr.io/knmplace/dispatcharr-vod-tmdb-companion:latest
    # Or build from source: build: https://github.com/knmplace/dispatcharr-vod-tmdb-companion.git
    container_name: vod-tmdb-companion
    restart: unless-stopped
    networks:
      - dispatcharr_default   # CHANGE ME: your Dispatcharr stack's network name
    env_file:
      - ${DISPATCHARR_ENV_FILE}   # CHANGE ME: path to your Dispatcharr stack's .env (supplies POSTGRES_*)
    environment:
      - TZ=${TZ:-UTC}
      - TMDB_API_KEY=${TMDB_API_KEY}          # required, get one free at themoviedb.org
      - DRY_RUN=${DRY_RUN:-true}              # keep true until you've reviewed a dry-run pass
      - AUTO_ACCEPT_CONFIDENCE=${AUTO_ACCEPT_CONFIDENCE:-80}
      - MAX_ROWS=${MAX_ROWS:-0}
      - WORKER_THREADS=${WORKER_THREADS:-8}
      - TEST_WRITE_LIMIT=${TEST_WRITE_LIMIT:-0}
      # POSTGRES_HOST/PORT/DB/USER/PASSWORD come from env_file above, not
      # from this block. Only override here if your Dispatcharr .env uses
      # different variable names than dispatcharr.settings expects, or if
      # POSTGRES_HOST needs to differ from what Dispatcharr itself uses
      # (e.g. Dispatcharr connects via "localhost" because Postgres runs in
      # its own container, but this companion needs the container's name
      # instead since it's a separate container on the shared network):
      # - POSTGRES_HOST=dispatcharr   # uncomment + set only if needed
      #
      # Redis is not required by this tool. Dispatcharr's own app-ready
      # hooks will attempt (and harmlessly fail/retry for ~30s at startup)
      # a Redis connection at the default of localhost:6379 unless you set
      # REDIS_HOST here to point at your real Redis.
    volumes:
      - ${DATA_DIR}:/data   # CHANGE ME: e.g. /etc/docker/tmdbtool -- same layout convention as your other stacks
    ports:
      - "${COMPANION_PORT:-8686}:8686"

networks:
  dispatcharr_default:      # CHANGE ME: must match the network block name above
    external: true
