# Example compose service to add to your OWN existing Dispatcharr stack.
# Copy the `vod-tmdb-companion` service block below into your Dispatcharr
# docker-compose.yml (or docker stack, e.g. Portainer) and adjust the values
# marked CHANGE ME. Do not deploy this file standalone -- it must join the
# same Docker network as your Dispatcharr container to reach its Postgres.
#
# This container reaches Dispatcharr's Postgres over Docker's internal
# network, not a published port -- Postgres/Redis should never be exposed
# externally for this to work. Find your Dispatcharr network name with:
#   docker inspect <dispatcharr_container> \
#     --format '{{range .NetworkSettings.Networks}}{{.NetworkID}} {{end}}'
#   docker network ls   # match the network ID above to a name
#
# --- Postgres credentials: which case are you? ---
#
# All-in-one (AIO) Dispatcharr image (Postgres runs inside the SAME
# container as Dispatcharr): the AIO image does not expose POSTGRES_* as
# container env vars and has no .env file to inherit from -- Dispatcharr's
# own settings.py falls back to fixed internal defaults (NAME=dispatcharr,
# USER=dispatch). This is the common case. Set POSTGRES_* directly in the
# `environment:` block below (via your OWN .env, not Dispatcharr's -- see
# .env.example) and point POSTGRES_HOST at the Dispatcharr CONTAINER'S NAME
# (not "localhost" -- that only resolves inside Dispatcharr's own container).
#
# Split multi-container deployment with its own postgres service AND a real
# .env file Dispatcharr reads: uncomment the `env_file:` line instead and
# point it at that file, then you can remove the individual POSTGRES_*
# lines below since env_file supplies them. Confirm the actual values
# first (e.g. `docker exec <dispatcharr_container> env | grep -i postgres`)
# -- don't assume a .env exists just because this is the split-container case.
services:
  vod-tmdb-companion:
    image: ghcr.io/knmplace/dispatcharr-vod-tmdb-companion:latest
    # Or build from source: build: https://github.com/knmplace/dispatcharr-vod-tmdb-companion.git
    container_name: vod-tmdb-companion
    restart: unless-stopped
    networks:
      - dispatcharr_default   # CHANGE ME: your Dispatcharr stack's network name
    # env_file:
    #   - ${DISPATCHARR_ENV_FILE}   # only if your Dispatcharr deployment actually has its own .env -- see note above
    environment:
      - TZ=${TZ:-UTC}
      # TMDB_API_KEY, DRY_RUN, AUTO_ACCEPT_CONFIDENCE, MAX_ROWS,
      # WORKER_THREADS, TEST_WRITE_LIMIT are NOT set here -- they're
      # configured from the dashboard (Settings section at http://<host>:
      # ${COMPANION_PORT:-8686}/) after first boot and persisted to
      # ${DATA_DIR}/settings.json, so changing them doesn't require editing
      # this file or recreating the container.
      #
      # Postgres -- values below come from YOUR OWN .env (see .env.example),
      # not from Dispatcharr's. CHANGE ME if your setup differs from the AIO
      # defaults shown:
      - POSTGRES_HOST=${POSTGRES_HOST}            # CHANGE ME: your Dispatcharr container's NAME (e.g. dispatcharr), not "localhost"
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-dispatcharr}
      - POSTGRES_USER=${POSTGRES_USER:-dispatch}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}    # CHANGE ME: AIO default is "secret" -- confirm yours, don't assume
      #
      # Redis is not required by this tool. Dispatcharr's own app-ready
      # hooks will attempt (and harmlessly fail/retry for ~30s at startup)
      # a Redis connection at the default of localhost:6379 unless you set
      # REDIS_HOST here to point at your real Redis.
    volumes:
      - ${DATA_DIR}:/data   # CHANGE ME: e.g. /etc/docker/tmdbtool -- same layout convention as your other stacks in the .ENV
    ports:
      - "${COMPANION_PORT:-8686}:8686" # CHANGE IF NEEDED IN ENV

networks:
  dispatcharr_default:      # CHANGE ME: must match the network block name above
    external: true
